<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運命の伏線 診断ページ</title>
    <!-- もしもアフィリエイト基本スクリプト -->
    <script type="text/javascript" src="//dn.msmstatic.com/site/cardlink/bundle.js?20220329"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="meta-bar">
        <span class="pr-badge">PR</span>
        <span class="version-text">Ver 2.0.0</span>
    </div>

    <div id="start-screen">
        <h1>運命の伏線<br>魂の軌道修正・10系層解読</h1>
        <p class="description">
            あなたの深層意識に眠る「停滞の真因」を深く解読します。<br><br>
            直感に従って10の選択を重ね、今あなたが目醒めるために必要な「気づき」を受け取ってください。
        </p>
        <button class="btn btn-start" onclick="startQuiz()">無料で診断をスタートする</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="stars-outer" id="stars-container">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>
        <div class="question-num" id="question-num">質問 1 / 10</div>
        <div class="question-text" id="question-text">質問テキスト</div>
        <button class="btn" id="btn-a" onclick="nextQuestion('A')">選択肢A</button>
        <button class="btn" id="btn-b" onclick="nextQuestion('B')">選択肢B</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-title" id="result-type">診断結果タイトル</div>
        <div class="result-body" id="result-text">診断結果の詳細説明テキスト</div>
        <div class="recommend-box">
            <div class="recommend-title">運命を変えるトリガーアイテム</div>
            <div class="recommend-desc" id="recommend-desc">商品提案の文章</div>

            <div class="affiliate-container" id="affiliate-target"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
