<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運命の伏線 診断ページ</title>
    <style>
        :root {
            --bg-color: #0f081d;
            --card-bg: rgba(255, 255, 255, 0.07);
            --border-color: rgba(224, 169, 109, 0.3);
            --gold: #f3c669;
            --gold-bright: #ffd700;
            --text-color: #ffffff;
            --sub-text: #d1c4e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: radial-gradient(circle at top, #23123d, #0f081d);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 12px;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        p.description {
            font-size: 0.95rem;
            color: var(--sub-text);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .stars-outer {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .star {
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .star.active {
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            transform: scale(1.15);
        }

        .question-num {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 24px;
            min-height: 3.3em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 30px;
            border: 1px solid var(--gold);
            background: linear-gradient(135deg, #4a154b, #2b0938);
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            display: inline-block;
        }

        .btn:active {
            transform: scale(0.98);
            background: linear-gradient(135deg, #611f62, #3c0d4e);
        }

        .btn-start {
            background: linear-gradient(135deg, #d4af37, #8a6d1c);
            color: #0f081d;
            border: none;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .btn-amazon {
            background: linear-gradient(135deg, #ff9900, #e67a00);
            color: #ffffff;
            border: none;
            font-size: 1.05rem;
            margin-top: 16px;
        }

        .hidden {
            display: none;
        }

        .result-title {
            font-size: 1.25rem;
            color: var(--gold);
            margin-bottom: 14px;
        }

        .result-body {
            font-size: 0.95rem;
            color: #ffffff;
            line-height: 1.7;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .recommend-box {
            border-top: 1px dashed var(--border-color);
            padding-top: 16px;
            margin-top: 16px;
        }

        .recommend-title {
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .recommend-desc {
            font-size: 0.9rem;
            color: var(--sub-text);
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>運命の伏線<br>未来予言＆波動深掘り診断</h1>
        <p class="description">
            あなたの回答に応じて、潜在意識の奥底にある悩みを深く紐解いていきます。<br><br>
            直感で質問に答えて、今のあなたに最も必要な解決策を見つけましょう。
        </p>
        <button class="btn btn-start" onclick="startQuiz()">無料で診断をスタートする</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="stars-outer" id="stars-container">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
        </div>
        <div class="question-num" id="question-num">質問 1 / 10</div>
        <div class="question-text" id="question-text">質問内容が入ります</div>
        <button class="btn" id="btn-a" onclick="nextQuestion('A')">選択肢A</button>
        <button class="btn" id="btn-b" onclick="nextQuestion('B')">選択肢B</button>
    </div>

    <div id="result-screen" class="hidden">
        <div class="result-title" id="result-type">診断結果タイトル</div>
        <div class="result-body" id="result-text">診断結果の詳細説明テキスト</div>
        <div class="recommend-box">
            <div class="recommend-title">あなたにおすすめの開運アイテム</div>
            <div class="recommend-desc" id="recommend-desc">商品提案の文章</div>
            <a id="amazon-btn" href="#" target="_blank" class="btn btn-amazon">Amazonで詳細を見る</a>
        </div>
    </div>
</div>

<script>
    const treeData = {
        q1: {
            text: "今、最も解消したいと感じている状態はどちらですか？",
            btnA: "行動したいのに動けない停滞感",
            btnB: "頭の中のモヤモヤや不調感",
            nextA: "q2_action",
            nextB: "q2_mind"
        },
        q2_action: {
            text: "行動に移せない主な原因は何だと感じますか？",
            btnA: "毎日が流れるように過ぎて時間がない",
            btnB: "何から手をつければいいか整理できていない",
            nextA: "q3_time",
            nextB: "q3_organize"
        },
        q2_mind: {
            text: "頭のモヤモヤはどこから来ていると感じますか？",
            btnA: "言葉にできない不安や感情の乱れ",
            btnB: "周りの環境や人間関係からの影響",
            nextA: "q3_emotion",
            nextB: "q3_space"
        },
        q3_time: {
            text: "理想の未来のために、残したい足あとはどちらですか？",
            btnA: "日々の成長や出来事の具体的な記録",
            btnB: "その時感じた大切な気づきや感情",
            nextA: "q4_journal",
            nextB: "q4_journal"
        },
        q3_organize: {
            text: "頭の中を整理するためにやってみたいことはどちらですか？",
            btnA: "思考をすべて紙に書き出すこと",
            btnB: "静かな時間を作って自分と向き合うこと",
            nextA: "q4_notebook",
            nextB: "q4_notebook"
        },
        q3_emotion: {
            text: "感情を整えるために必要なものはどちらですか？",
            btnA: "感情を吐き出して吐き出す手段",
            btnB: "心を静めてリラックスする時間",
            nextA: "q4_pen",
            nextB: "q4_incense"
        },
        q3_space: {
            text: "身の回りの波動を整えるために変化させたいものはどちらですか？",
            btnA: "お部屋や空間のエネルギー",
            btnB: "自分自身の身体と意識の波長",
            nextA: "q4_incense",
            nextB: "q4_stone"
        },
        q4_journal: {
            text: "毎日の足あとを確実な変化に変えるための質問です。習慣化できそうな方法は？",
            btnA: "日付の入った特別な1冊に毎日数行書く",
            btnB: "お気に入りのノートに自由なタイミングで書く",
            nextA: "res_journal",
            nextB: "res_notebook"
        },
        q4_notebook: {
            text: "思考の整理をサポートするために適していると感じるものは？",
            btnA: "自由になんでも書き込める上質なノート",
            btnB: "感情や思考をスムーズに紡ぎ出せる特別なペン",
            nextA: "res_notebook",
            nextB: "res_pen"
        },
        q4_pen: {
            text: "心のモヤモヤを手放すために重要なことは？",
            btnA: "紙とペンを使って外に書き出すこと",
            btnB: "香りや空気感を変えて気分をリセットすること",
            nextA: "res_pen",
            nextB: "res_incense"
        },
        q4_incense: {
            text: "空間のエネルギーをクリアにするために惹かれるものは？",
            btnA: "天然のホワイトセージやお香の煙で浄化する",
            btnB: "パワーストーンを置いて空間の波長を整える",
            nextA: "res_incense",
            nextB: "res_stone"
        },
        q4_stone: {
            text: "身につけるものからエネルギーを得るならどちらが良いですか？",
            btnA: "自分を守って導いてくれる天然石",
            btnB: "空間全体を包み込む浄化アイテム",
            nextA: "res_stone",
            nextB: "res_incense"
        }
    };

    const results = {
        res_journal: {
            title: "未来書き換え日記タイプ",
            text: "あなたの悩みは、毎日の生活が流れるように過ぎ去り、自分の確かな足あとを残せていないことにあります。未来を変える最も確実な方法は、毎日の出来事や気づきを数行でも記録することです。過去の記録が未来のあなたを強力に支えてくれます。",
            desc: "日付記入式の日記帳を手に入れて、1日3行から人生の足あとを残す習慣をスタートさせましょう。",
            link: "https://www.amazon.co.jp/dp/YOUR_DIARY_ASIN?tag=YOUR_ASSOCIATE_TAG"
        },
        res_notebook: {
            title: "思考整理プレミアムノートタイプ",
            text: "あなたの悩みは、やりたいことやアイデアが頭の中で複雑に絡まり、整理できていないことにあります。頭の中にあるものをすべて紙の上に書き出すことで、次に取るべき行動が明確になり、運気が一気に動き出します。",
            desc: "書き心地にこだわった質の高いハードカバーノートが、あなたの思考を整理する最高のパートナーになります。",
            link: "https://www.amazon.co.jp/dp/YOUR_NOTE_ASIN?tag=YOUR_ASSOCIATE_TAG"
        },
        res_pen: {
            title: "感情デトックス万年筆タイプ",
            text: "あなたの悩みは、言葉にできないモヤモヤやストレスを内に溜め込んでしまっている点にあります。特別なペンを使って紙に感情を書き吐き出すことで、心の浄化が進み、新しい良い波長を取り入れる準備が整います。",
            desc: "滑らかな書き心地の万年筆を用意し、夜寝る前の思考デトックス時間を習慣にしてみてください。",
            link: "https://www.amazon.co.jp/dp/YOUR_PEN_ASIN?tag=YOUR_ASSOCIATE_TAG"
        },
        res_incense: {
            title: "空間波動浄化タイプ",
            text: "あなたの悩みは、周囲の環境や不要なエネルギーの影響を受け、自分のペースを乱されていることにあります。まずは過ごす空間のエネルギーを清め、心が落ち着く聖域を作ることが運気好転の第一歩です。",
            desc: "天然のホワイトセージやお香を取り入れて、お部屋の停滞した波動を一瞬でリセットしましょう。",
            link: "https://www.amazon.co.jp/dp/YOUR_INCENSE_ASIN?tag=YOUR_ASSOCIATE_TAG"
        },
        res_stone: {
            title: "波長整流パワーストーンタイプ",
            text: "あなたの悩みは、自分自身のエネルギーバランスが崩れ、本来持っている直感力や引き寄せの力が発揮できていない点にあります。あなたの波長を整えるサポートアイテムを取り入れることで、幸運を呼び込みやすくなります。",
            desc: "あなたの直感を研ぎ澄まし、保護と導きを与えてくれる天然石のブレスレットや原石を身につけましょう。",
            link: "https://www.amazon.co.jp/dp/YOUR_STONE_ASIN?tag=YOUR_ASSOCIATE_TAG"
        }
    };

    let currentStep = 1;
    let currentKey = "q1";

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        const node = treeData[currentKey];
        document.getElementById('question-num').textContent = `質問 ${currentStep} / 10`;
        document.getElementById('question-text').textContent = node.text;
        document.getElementById('btn-a').textContent = node.btnA;
        document.getElementById('btn-b').textContent = node.btnB;
        updateStars();
    }

    function updateStars() {
        const stars = document.querySelectorAll('#stars-container .star');
        stars.forEach((star, index) => {
            if (index < currentStep) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    function nextQuestion(choice) {
        const node = treeData[currentKey];
        const nextKey = choice === 'A' ? node.nextA : node.nextB;

        currentStep++;

        if (nextKey.startsWith('res_') || currentStep > 10) {
            const finalResKey = nextKey.startsWith('res_') ? nextKey : 'res_journal';
            showResult(finalResKey);
        } else {
            currentKey = nextKey;
            renderQuestion();
        }
    }

    function showResult(resKey) {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const resData = results[resKey];
        document.getElementById('result-type').textContent = resData.title;
        document.getElementById('result-text').textContent = resData.text;
        document.getElementById('recommend-desc').textContent = resData.desc;
        document.getElementById('amazon-btn').href = resData.link;
    }
</script>

</body>
</html>
